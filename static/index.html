<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
tailwind.config={theme:{extend:{colors:{
  night:{900:'#0a0e1a',800:'#111827',700:'#1a2235',600:'#243047'},
  accent:'#22d3ee',warn:'#f59e0b',crit:'#f43f5e',good:'#10b981'
}}}};

<style>
body{font-family:'Inter',system-ui,sans-serif;}
.tab-active{border-bottom:3px solid #22d3ee;color:#22d3ee;font-weight:600;}
.card{background:#111827;border:1px solid #243047;border-radius:0.75rem;}
.muted{color:#9ca3af;}
.chip{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600;}
.chip.green{background:#10b98122;color:#10b981;}
.chip.red{background:#f43f5e22;color:#f43f5e;}
.chip.amber{background:#f59e0b22;color:#f59e0b;}
.chip.cyan{background:#22d3ee22;color:#22d3ee;}
.chip.blue{background:#3b82f622;color:#3b82f6;}
.btn{border:1px solid #243047;border-radius:0.5rem;padding:6px 12px;font-size:13px;transition:all .15s;}
.btn:hover{background:#1a2235;}
.btn.primary{background:#22d3ee22;border-color:#22d3ee55;color:#22d3ee;}
.btn.primary:hover{background:#22d3ee33;}
.btn.crit{background:#f43f5e22;border-color:#f43f5e55;color:#f43f5e;}
input,select,textarea{background:#0a0e1a;border:1px solid #243047;border-radius:0.5rem;padding:6px 10px;font-size:13px;color:#e5e7eb;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#22d3ee88;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:#9ca3af;font-weight:500;padding:8px;border-bottom:1px solid #243047;}
td{padding:8px;border-bottom:1px solid #1a2235;}
tr:hover{background:#1a223544;}
.scroll{max-height:500px;overflow-y:auto;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#243047;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* Tooltip informativo */
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#243047;color:#6b7280;font-size:10px;font-weight:700;cursor:help;flex-shrink:0;margin-left:4px;}
.tip:hover{background:#22d3ee33;color:#22d3ee;}
.tip .tip-text{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1a2235;border:1px solid #243047;border-radius:0.5rem;padding:8px 12px;font-size:11px;font-weight:400;line-height:1.5;white-space:nowrap;color:#d1d5db;z-index:50;min-width:200px;max-width:320px;white-space:normal;pointer-events:none;box-shadow:0 4px 20px #00000066;}
.tip:hover .tip-text{display:block;}

/* stock bar animation */
.stock-bar{transition:width 0.5s ease;}

/* Google Maps Leaflet Styles */
.leaflet-container{font-family:'Inter',system-ui,sans-serif;background:#e5e3df;border-radius:0.75rem;}
.leaflet-popup-content-wrapper{background:#111827;color:#f3f4f6;border-radius:0.75rem;padding:0;overflow:hidden;border:1px solid #243047;box-shadow:0 10px 25px -5px rgba(0,0,0,0.5);}
.leaflet-popup-content{margin:0;line-height:1.4;}
.leaflet-popup-tip{background:#111827;}
.gmap-marker-container{background:transparent;border:none;}

/* Pulsos animados estilo radar para Google Maps */
@keyframes gmap-pulse-red{0%{transform:scale(0.8);opacity:0.9;}50%{transform:scale(1.5);opacity:0.2;}100%{transform:scale(0.8);opacity:0.9;}}
@keyframes gmap-pulse-amber{0%{transform:scale(0.8);opacity:0.9;}50%{transform:scale(1.3);opacity:0.3;}100%{transform:scale(0.8);opacity:0.9;}}
@keyframes gmap-pulse-green{0%{transform:scale(0.8);opacity:0.8;}50%{transform:scale(1.2);opacity:0.2;}100%{transform:scale(0.8);opacity:0.8;}}
.pulse-ring-red{animation:gmap-pulse-red 1.4s infinite ease-out;}
.pulse-ring-amber{animation:gmap-pulse-amber 1.8s infinite ease-out;}
.pulse-ring-green{animation:gmap-pulse-green 2.2s infinite ease-out;}

/* Controles flotantes estilo Google Maps */
.gmap-chip{background:#111827dd;border:1px solid #243047;color:#d1d5db;backdrop-filter:blur(4px);padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
.gmap-chip:hover{background:#1a2235;color:#ffffff;}
.gmap-chip.active{background:#22d3ee;color:#0a0e1a;border-color:#22d3ee;}

/* Drag & Drop Zone and Modern UI accents */
.drop-zone{border:2px dashed #243047;background:rgba(17,24,39,0.7);transition:all 0.2s ease-in-out;border-radius:0.75rem;}
.drop-zone:hover, .drop-zone.dragover{border-color:#22d3ee;background:rgba(34,211,238,0.06);transform:translateY(-1px);}
.tab-pill{transition:all 0.15s ease;}
.tab-pill.active{background:#22d3ee22;color:#22d3ee;border-color:#22d3ee88;font-weight:600;}
.card-header-gradient{background:linear-gradient(180deg, rgba(34,211,238,0.04) 0%, transparent 100%);}
</style>
</head>
<body class="bg-night-900 text-gray-200 min-h-screen">
<div class="max-w-7xl mx-auto p-4">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <nav class="flex gap-4 flex-wrap border-b border-night-600 mb-4 text-sm">

    <button class="tab pb-2 muted hover:text-white" data-tab="m2">2 · Rutas &amp; Agente</button>

    <button class="tab pb-2 muted hover:text-white" data-tab="m4">4 · Proveedores</button>
    <button class="tab pb-2 muted hover:text-white" data-tab="m5">5 · Gobernanza</button>
    <button class="tab pb-2 muted hover:text-white" data-tab="stock">6 · Cargar Stock</button>

  <!-- CONTENIDO: se rellena por JS, el canvas vive aquí fuera para no morir -->

</div>

<script>
const API='';
let demandChart=null;
let currentTab='m1';

const $=sel=>document.querySelector(sel);
const $$=sel=>document.querySelectorAll(sel);

function showToast(title, message='', type='info'){
  const cont=$('#toast-container');
  if(!cont)return;
  const colors={
    success:'border-emerald-500/60 bg-night-800/95 text-emerald-300',
    warn:'border-amber-500/60 bg-night-800/95 text-amber-300',
    error:'border-rose-500/60 bg-night-800/95 text-rose-300',
    info:'border-cyan-500/60 bg-night-800/95 text-cyan-300'
  };
  const icons={success:'✅',warn:'⚠️',error:'❌',info:'⚡'};
  const el=document.createElement('div');
  el.className=`pointer-events-auto border-l-4 rounded-lg p-3 shadow-2xl backdrop-blur transition-all duration-300 ${colors[type]||colors.info}`;
  el.innerHTML=`
    <div class="flex items-start justify-between gap-2">
      <div class="flex items-start gap-2">
        <span class="text-sm">${icons[type]||icons.info}</span>
        <div>
          <div class="text-xs font-bold text-white">${title}</div>
          ${message?`<div class="text-[11px] text-gray-300 mt-0.5 whitespace-pre-line">${message}</div>`:''}
        </div>
      </div>
      <button onclick="this.closest('div.pointer-events-auto').remove()" class="text-gray-400 hover:text-white text-xs">✕</button>
    </div>`;
  cont.appendChild(el);
  setTimeout(()=>{ if(el.parentNode)el.remove(); }, 5000);
}

async function switchUserRole(role){
  try{
    const r=await api('/api/governance/role',{method:'POST',body:JSON.stringify({role})});
    const badge=$('#role-badge');
    if(badge)badge.textContent=r.current_role.replace('_',' ');
    showToast('Rol activo actualizado', `Ahora operas como "${r.current_role.replace('_',' ')}" (${r.can_authorize?'Con permisos HITL':'Solo lectura / Sin firma HITL'})`, r.can_authorize?'success':'warn');
    if(currentTab==='m5')loadM5();
  }catch(e){
    showToast('Error cambiando rol', e.message, 'error');
  }
}

async function api(path,opts={}){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),15000);
  try{
    const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},signal:ctrl.signal,...opts});
    if(!r.ok){
      let detail=await r.text();
      try{ const j=JSON.parse(detail); detail=j.detail||detail; }catch(_){}
      throw new Error(detail);
    }
    return r.json();
  }finally{clearTimeout(t);}
}

/* ---- Tooltip helper ---- */
function tip(text){ return `<span class="tip">?<span class="tip-text">${text}</span></span>`; }

/* ---- Tabs ---- */
document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click',()=>switchTab(b.dataset.tab));
});
function switchTab(tab){
  currentTab=tab;
  $$('.tab').forEach(b=>{
    const on=b.dataset.tab===tab;
    b.classList.toggle('tab-active',on);
    b.classList.toggle('muted',!on);
  });
  loadTab();
}
function render(contentHTML){ $('#content').innerHTML=contentHTML; const l=$('#loading'); if(l)l.style.display='none'; }

/* ---- KPIs ---- */
async function loadKPIs(){
  try{

    const d=await api('/api/dashboard');
    $('#kpis').innerHTML=`
      <div class="card p-3">
        <div class="text-xs muted">Reducción error previsión ${tip('Comparación del modelo predictivo vs un método naive (repetir el último valor). Objetivo McKinsey: reducir errores 20-50%.')}</div>
        <div class="text-2xl font-bold text-good">${d.forecast_improvement.avg_error_reduction_pct??'—'}%</div>
        <div class="text-[11px] muted">vs baseline naive</div>
      </div>
      <div class="card p-3">
        <div class="text-xs muted">Proveedores en riesgo ${tip('Proveedores con score de riesgo < 60 (sobre 100). Evalúa OTIF + estabilidad financiera + riesgo geopolítico.')}</div>
        <div class="text-2xl font-bold text-warn">${d.supplier_risk.length}</div>
        <div class="text-[11px] muted">score &lt; 60</div>
      </div>
      <div class="card p-3">
        <div class="text-xs muted">Pendientes aprobación ${tip('Decisiones de la IA que requieren tu autorización antes de ejecutarse (coste alto, contractual, legal).')}</div>
        <div class="text-2xl font-bold text-crit">${d.pending_approvals}</div>
        <div class="text-[11px] muted"><a class="text-accent cursor-pointer" onclick="switchTab('m5')">ver gobernanza →</a></div>
      </div>
      <div class="card p-3">
        <div class="text-xs muted">Trabajos abiertos ${tip('Órdenes de mantenimiento predictivo generadas automáticamente antes de que la maquinaria falle.')}</div>
        <div class="text-2xl font-bold text-warn">${d.open_work_orders}</div>
        <div class="text-[11px] muted">mantenimiento IoT</div>
      </div>
      <div class="card p-3">
        <div class="text-xs muted">Entregas activas ${tip('Envíos en tránsito o planificados que el agente autónomo monitoriza en tiempo real.')}</div>
        <div class="text-2xl font-bold text-accent">${d.active_deliveries}</div>
        <div class="text-[11px] muted">${d.alerts_open} alertas</div>
      </div>`;
  }catch(e){ console.error(e); }
}

/* ==================== MÓDULO 1 ==================== */
async function loadM1(){
  const [skus,regions,improvement]=await Promise.all([
    api('/api/demand/skus'),api('/api/demand/regions'),api('/api/demand/improvement')
  ]);
  render(`
  <!-- Panel de control + gráfico (lado a lado) -->
  <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
    <!-- CONTROLES -->
    <div class="card p-4 space-y-3">
      <div class="flex items-center gap-1">
        <h3 class="font-semibold text-white">Configurar previsión</h3>
        ${tip('Selecciona un producto y región. El modelo ML usa datos históricos + clima + promociones para predecir la demanda futura.')}
      </div>

      <div>
        <div class="flex items-center gap-1 mb-1">
          <label class="text-xs muted">Producto</label>
          ${tip('Elige el SKU cuya demanda quieres predecir. Cada producto tiene un patrón de demanda distinto.')}
        </div>
        <select id="m1-sku" onchange="runForecast()" class="w-full">${skus.map(s=>`<option value="${s.sku}">${s.name}</option>`).join('')}</select>
      </div>

      <div>
        <div class="flex items-center gap-1 mb-1">
          <label class="text-xs muted">Región</label>
          ${tip('La ubicación geográfica afecta el clima, las promociones locales y el inventario disponible.')}
        </div>
        <select id="m1-region" onchange="runForecast()" class="w-full">${regions.map(r=>`<option value="${r.region_id}">${r.name}</option>`).join('')}</select>
      </div>

      <div>
        <div class="flex items-center gap-1 mb-1">
          <label class="text-xs muted">Horizonte de previsión</label>
          ${tip('Número de días futuros que se predicen. 14 días es típico para planificación semanal.')}
        </div>
        <div class="flex gap-2">
          <button class="btn text-xs" onclick="setHorizon(14)" id="h14">14d</button>
          <button class="btn primary text-xs" onclick="setHorizon(30)" id="h30">30d</button>
          <button class="btn text-xs" onclick="setHorizon(60)" id="h60">60d</button>
        </div>
        <input id="m1-horizon" type="hidden" value="30">
      </div>

      <hr class="border-night-600">

      <!-- Subida de archivo -->
      <div>
        <div class="flex items-center gap-1 mb-1">
          <label class="text-xs muted">Subir histórico ERP</label>
          ${tip('Importa ventas históricas en CSV (columnas: date, sku, region_id, units) o JSON. Esto enriquece el entrenamiento del modelo.')}
        </div>
        <input id="m1-file" type="file" accept=".csv,.json" class="text-xs w-full">
        <button class="btn w-full mt-2 text-xs" onclick="uploadSales()">Subir archivo</button>
      </div>
    </div>

    <!-- GRÁFICO -->
    <div class="card p-4 lg:col-span-3">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center gap-1">
          <h3 class="font-semibold text-white">Demanda predicha vs real</h3>
          ${tip('La línea cian es la predicción del modelo. El sombreado es el intervalo de confianza al 95%. Si hay datos reales recientes, aparecen en verde.')}
        </div>
        <span class="text-xs muted">Modelo: Holt-Winters + promos + clima</span>
      </div>
      <!-- Canvas: SE MANTIENE estático, no se recrea con innerHTML -->
      <div style="height:320px"><canvas id="demandChart"></canvas></div>
      <div id="m1-improvement" class="grid grid-cols-3 gap-3 mt-4"></div>
    </div>
  </div>

  <!-- Stock + Alertas -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
    <div class="card p-4">
      <div class="flex items-center gap-1 mb-3">
        <h3 class="font-semibold text-white">Stock actual en almacén</h3>
        ${tip('Nivel actual de inventario por producto y región. La barra muestra llenado relativo: si queda poco (rojo), hay riesgo de rotura.')}
      </div>
      <div class="scroll" id="m1-stock"></div>
    </div>
    <div class="card p-4">
      <div class="flex items-center gap-1 mb-3">
        <h3 class="font-semibold text-white">Alertas de inventario</h3>
        ${tip('El sistema detecta automáticamente: ROTURA = stock insuficiente para la demanda proyectada, EXCESO = demasiado inventario sin demanda.')}
      </div>
      <div id="m1-alerts" class="scroll text-xs muted">Genera una previsión para activar alertas.</div>
    </div>
  </div>`);

  $('#m1-improvement').innerHTML=`
    <div class="bg-night-700 rounded-lg p-3 text-center">
      <div class="text-xs muted">Error modelo (MAPE)</div>
      <div class="text-xl font-bold text-accent">${improvement.avg_model_mape??'—'}%</div>
    </div>
    <div class="bg-night-700 rounded-lg p-3 text-center">
      <div class="text-xs muted">Error naive</div>
      <div class="text-xl font-bold text-gray-400">${improvement.avg_naive_mape??'—'}%</div>
    </div>
    <div class="bg-night-700 rounded-lg p-3 text-center">
      <div class="text-xs muted">Mejora</div>
      <div class="text-xl font-bold ${improvement.meets_mckinsey_20_50?'text-good':'text-warn'}">${improvement.avg_error_reduction_pct??'—'}%</div>
      <div class="text-[10px] muted">obj. 20-50%</div>
    </div>`;

  await runForecast();
  await loadStock();
}

function setHorizon(d){
  $('#m1-horizon').value=d;
  [14,30,60].forEach(h=>{
    const b=$('#h'+h);
    if(b){ b.classList.remove('primary'); if(h===d)b.classList.add('primary'); }
  });
  runForecast();
}

async function runForecast(){
  if(!$('#m1-sku'))return;
  const sku=$('#m1-sku').value,region=$('#m1-region').value,horizon=$('#m1-horizon').value;
  const res=await api('/api/demand/forecast',{method:'POST',body:JSON.stringify({sku,region_id:region,horizon_days:parseInt(horizon)||30})});
  renderDemandChart(res);
  loadStock(); // refresca stock de la región seleccionada
  // Métricas del modelo PARA ESTE SKU/REGIÓN (no medias globales)
  const imp=$('#m1-improvement');
  if(imp){
    const meets=res.mape_improvement_pct!=null&&res.mape_improvement_pct>=20&&res.mape_improvement_pct<=50;
    imp.innerHTML=`
      <div class="bg-night-700 rounded-lg p-3 text-center">
        <div class="text-xs muted">Error modelo (MAPE)</div>
        <div class="text-xl font-bold text-accent">${res.mape??'—'}%</div>
      </div>
      <div class="bg-night-700 rounded-lg p-3 text-center">
        <div class="text-xs muted">Error naive</div>
        <div class="text-xl font-bold text-gray-400">${res.naive_mape??'—'}%</div>
      </div>
      <div class="bg-night-700 rounded-lg p-3 text-center">
        <div class="text-xs muted">Mejora sobre naive</div>
        <div class="text-xl font-bold ${meets?'text-good':'text-warn'}">${res.mape_improvement_pct??'—'}%</div>
        <div class="text-[10px] muted">obj. 20-50%</div>
      </div>`;
  }
  // Alertas
  $('#m1-alerts').innerHTML=res.alerts.map(a=>
    `<div class="flex items-start gap-2 py-2 border-b border-night-700">
      <span class="chip ${a.severity==='critical'?'red':a.severity==='warning'?'amber':'cyan'}">${a.severity}</span>
      <span class="text-xs">${a.message}</span>
    </div>`
  ).join('')||'<div class="flex items-center gap-2 py-2 text-good"><span class="chip green">ok</span><span class="text-xs">Sin alertas — inventario adecuado para la demanda proyectada.</span></div>';
}

function renderDemandChart(res){
  // DESTRUIR chart anterior antes de crear uno nuevo
  if(demandChart){demandChart.destroy();demandChart=null;}
  if(!$('#demandChart'))return;
  const actuals=res.recent_actuals||[];
  const actLabels=actuals.map(a=>a.date.slice(5));
  const projLabels=res.projections.map(p=>p.date.slice(5));
  const labels=[...actLabels,...projLabels];

  const actSeries=[...actuals.map(a=>a.actual_units),...new Array(projLabels.length).fill(null)];
  const bridgeVal=actuals.length?actuals[actuals.length-1].actual_units:null;
  const predPrefix=actuals.length?[...new Array(actuals.length-1).fill(null),bridgeVal]:[];
  const boundaryPrefix=new Array(actuals.length).fill(null);

  const pred=[...predPrefix,...res.projections.map(p=>p.predicted_units)];
  const up=[...boundaryPrefix,...res.projections.map(p=>p.upper_bound)];
  const low=[...boundaryPrefix,...res.projections.map(p=>p.lower_bound)];
  const ctx=$('#demandChart');
  demandChart=new Chart(ctx,{
    type:'line',
    data:{
      labels,
      datasets:[

async function loadStock(){
  const region=$('#m1-region')?$('#m1-region').value:'R-MAD';
  const rows=await api('/api/demand/stock?region_id='+encodeURIComponent(region));
  const sku=$('#m1-sku')?$('#m1-sku').value:null;
  let html='';
  if(!rows||rows.length===0){ html='<span class="text-xs muted">Sin datos de inventario para esta región.</span>'; }
  else{
    html=rows.map(r=>{
      const pct=Math.min(100,Math.max(0,parseInt(r.fill_pct)||0));
      const color=pct<30?'#f43f5e':pct<60?'#f59e0b':'#10b981';
      const isCurrent=sku&&r.sku===sku;
      return `<div class="flex items-center gap-3 py-1.5 border-b border-night-700 ${isCurrent?'bg-night-700':''}">
        <span class="text-xs font-mono text-gray-300 w-28">${r.sku.replace('SKU-','')}</span>
        <span class="text-xs muted flex-1 truncate">${r.name}</span>
        <div class="flex items-center gap-2 w-40">
          <div class="flex-1 bg-night-700 rounded-full h-2.5 overflow-hidden">
            <div class="stock-bar h-full rounded-full" style="width:${pct}%;background:${color}"></div>
          </div>
          <span class="text-[11px] font-mono w-10 text-right">${r.on_hand}</span>
        </div>
        <span class="chip ${pct<30?'red':pct<60?'amber':'green'}" style="font-size:10px">${pct<30?'⚠ bajo':pct<100?'ok':'lleno'}</span>
      </div>`;
    }).join('');
  }
  const nCrit=rows?rows.filter(r=>parseInt(r.fill_pct)<30).length:0;
  const nLow=rows?rows.filter(r=>parseInt(r.fill_pct)>=30&&parseInt(r.fill_pct)<60).length:0;
  $('#m1-stock').innerHTML=`
    <div class="flex items-center gap-3 text-[11px] muted mb-2">
      <span>📍 ${region}</span>
      <span class="text-crit">${nCrit} con riesgo</span>
      <span class="text-warn">${nLow} bajo nivel</span>
      <span>Click en un producto en el selector para resaltarlo</span>
    </div>
    ${html}`;
}

async function uploadSales(){
  const f=$('#m1-file').files[0];
  if(!f){ showToast('Selecciona un archivo', 'Elige un archivo .csv o .json con histórico de ventas.', 'warn'); return; }
  const fd=new FormData(); fd.append('file',f);
  const r=await fetch('/api/demand/ingest',{method:'POST',body:fd});
  const j=await r.json();
  showToast('Histórico ERP Ingestado', `Procesados ${j.rows_ingested}/${j.rows_received} registros.${j.unknown_skus.length?'\nSKUs no reconocidos: '+j.unknown_skus.join(', '):''}`, 'success');
  runForecast();
}

  };

}

function roadPath(a,b){
  if(a===b||!ROAD_NODES[a]||!ROAD_NODES[b])return [a,b];
  const prev={a:null},seen={};const q=[a];seen[a]=1;
  while(q.length){
    const u=q.shift();
    if(u===b){const p=[b];let cur=b;while(prev[cur]){p.unshift(prev[cur]);cur=prev[cur];}return p;}
    for(const v of (_roadAdj[u]||[]))if(!seen[v]){seen[v]=1;prev[v]=u;q.push(v);}
  }
  return [a,b];
}

function roadCoords(n){return ROAD_NODES[n]||MAP_CITIES[n.toLowerCase()];}

function getGeoRoadPoints(originCity,destCity){
  const path=roadPath(cityName(originCity),cityName(destCity));
  return path.map(n=>roadCoords(n)).filter(Boolean);
}

function interpolateGeoPoint(points,progressPct){
  if(!points||points.length===0)return [40.4168,-3.7038];
  if(points.length===1)return points[0];
  const t=Math.min(1,Math.max(0,progressPct/100));
  let totalDist=0;
  const segDists=[];
  for(let i=1;i<points.length;i++){
    const d=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);
    segDists.push(d);
    totalDist+=d;
  }
  if(totalDist===0)return points[0];
  let target=t*totalDist;
  for(let i=0;i<segDists.length;i++){
    if(target<=segDists[i]||i===segDists.length-1){
      const frac=segDists[i]===0?0:Math.min(1,target/segDists[i]);
      return [
        points[i][0]+(points[i+1][0]-points[i][0])*frac,
        points[i][1]+(points[i+1][1]-points[i][1])*frac
      ];
    }
    target-=segDists[i];
  }
  return points[points.length-1];
}

function truckState(d){
  if(d.telemetry_status==='disrupted'||d.status==='disrupted')return 'stopped';
  if((d.delay_min||0)>0||d.status==='retendered'||d.telemetry_status==='delayed')return 'delayed';
  if(d.status==='planned')return 'planned';
  return 'ok';
}

function setGMapTileLayer(mode){
  if(!gLeafletMap)return;
  gMapCurrentMode=mode;
  if(gMapTileLayer){gLeafletMap.removeLayer(gMapTileLayer);gMapTileLayer=null;}
  if(gMapLabelsLayer){gLeafletMap.removeLayer(gMapLabelsLayer);gMapLabelsLayer=null;}

  // Actualizar botones visuales
  ['streets','satellite','dark'].forEach(m=>{
    const btn=$('#gmap-btn-'+m);
    if(btn)btn.classList.toggle('primary',m===mode);
  });

  const cont=$('#gmap-container');
  if(cont){
    cont.classList.toggle('gmap-dark',mode==='dark');
  }

  try{
    if(mode==='satellite'){
      // Esri World Imagery + labels
      gMapTileLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
        maxZoom:18,
        attribution:'Esri, Maxar, Earthstar'
      }).addTo(gLeafletMap);
      gMapLabelsLayer=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',{
        subdomains:'abcd',maxZoom:18
      }).addTo(gLeafletMap);
    }else if(mode==='dark'){
      // Carto Dark Matter
      gMapTileLayer=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
        subdomains:'abcd',maxZoom:19,
        attribution:'&copy; CARTO &copy; OpenStreetMap'
      }).addTo(gLeafletMap);
    }else{
      // Google Maps Streets palette: Carto Voyager
      gMapTileLayer=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
        subdomains:'abcd',maxZoom:19,
        attribution:'&copy; CARTO &copy; OpenStreetMap'
      }).addTo(gLeafletMap);
    }
  }catch(err){
    console.warn("Fallo cargando mosaico online:", err);
  }
}

function focusShipmentOnMap(shipmentId, zoomIn=false){

  const latLng=marker.getLatLng();

function handleGMapSearch(q){
  q=(q||'').trim().toLowerCase();
  const resDiv=$('#gmap-search-results');
  if(!resDiv)return;
  if(!q){resDiv.innerHTML='';resDiv.classList.add('hidden');return;}

  const matches=[];
  // Buscar en envíos
  gMapDeliveriesCache.forEach(d=>{
    if((d.shipment_id||'').toLowerCase().includes(q) || (d.destination||'').toLowerCase().includes(q) || (d.carrier_name||'').toLowerCase().includes(q)){
      matches.push({type:'shipment',id:d.shipment_id,title:`🚚 ${d.shipment_id}`,subtitle:`${cityName(d.origin)} ➔ ${cityName(d.destination)} (${d.carrier_name||d.carrier_id})`});
    }
  });
  // Buscar en almacenes hub
  WAREHOUSE_HUBS.forEach(h=>{
    if(h.name.toLowerCase().includes(q) || h.city.toLowerCase().includes(q) || h.id.toLowerCase().includes(q)){
      matches.push({type:'hub',id:h.id,lat:h.lat,lng:h.lng,title:`🏢 ${h.name}`,subtitle:`Hub Logístico ${h.city} (${h.country||'SCM'})`});
    }
  });

  if(matches.length===0){
    resDiv.innerHTML='<div class="p-2 text-xs muted">Sin resultados</div>';
    resDiv.classList.remove('hidden');
    return;
  }

  resDiv.innerHTML=matches.slice(0,5).map(m=>`
    <div onclick="selectGMapSearchResult('${m.type}','${m.id}')" class="p-2 hover:bg-night-700 cursor-pointer border-b border-night-700/60 last:border-0">
      <div class="text-xs font-bold text-white">${m.title}</div>
      <div class="text-[11px] muted">${m.subtitle}</div>
    </div>
  `).join('');
  resDiv.classList.remove('hidden');
}

function selectGMapSearchResult(type,id){
  const resDiv=$('#gmap-search-results');
  if(resDiv)resDiv.classList.add('hidden');
  const input=$('#gmap-search');
  if(input)input.value=id;

  if(type==='shipment'){
    focusShipmentOnMap(id,true);
  }else if(type==='hub'){
    const hub=WAREHOUSE_HUBS.find(h=>h.id===id);
    if(hub&&gLeafletMap){
      gLeafletMap.flyTo([hub.lat,hub.lng],10,{duration:1.0});
      const hm=gMapHubMarkers.find(m=>m._hubId===id);
      if(hm)hm.openPopup();
    }
  }
}

function initGoogleMap(deliveries){
  const mapDiv=$('#gmap-interactive');
  if(!mapDiv)return;
  if(typeof L==='undefined'){
    $('#gmap-container').innerHTML=renderMapFallback(deliveries);
    return;
  }

  // Destruir mapa anterior si existía
  if(gLeafletMap){
    try{ gLeafletMap.remove(); }catch(e){}
    gLeafletMap=null;
    gMapMarkersMap={};
    gMapRoutesMap={};
    gMapHubMarkers=[];
  }

  // Inicializar Leaflet con vista centrada en Sudamérica (Eje logístico SP-BH-RJ) con más zoom
  gLeafletMap=L.map('gmap-interactive',{
    center:[-21.5,-46.5],
    zoom:7, // Bastante más zoom para ver con nitidez satelital rutas, autopistas y ciudades
    zoomControl:false
  });

  // Configurar capa base (Satelital de alta definición con etiquetas vívidas)
  setGMapTileLayer(gMapCurrentMode);

  // Pintar almacenes hub principales
  WAREHOUSE_HUBS.forEach(hub=>{
    const icon=createGMapPinIcon('#3b82f6','hub',hub.city,null);
    const m=L.marker([hub.lat,hub.lng],{icon}).addTo(gLeafletMap);
    m._hubId=hub.id;
    m.bindPopup(gmapHubInfoWindowHtml(hub),{className:'gmap-popup'});
    gMapHubMarkers.push(m);
  });

  updateGMapDeliveries(deliveries);
}

function updateGMapDeliveries(deliveries){
  gMapDeliveriesCache=deliveries||[];
  if(!gLeafletMap)return;

  // Recordar si algún popup estaba abierto para no cerrarlo en refresco automático
  let openPopupShipId=null;
  Object.entries(gMapMarkersMap).forEach(([sid,m])=>{
    if(m.isPopupOpen&&m.isPopupOpen())openPopupShipId=sid;
    gLeafletMap.removeLayer(m);
  });
  Object.values(gMapRoutesMap).forEach(layers=>{
    if(Array.isArray(layers))layers.forEach(l=>gLeafletMap.removeLayer(l));
    else if(layers)gLeafletMap.removeLayer(layers);
  });
  gMapMarkersMap={};
  gMapRoutesMap={};

  // Visibilidad de hubs
  const showHubs=(gMapActiveFilter==='all'||gMapActiveFilter==='hubs');
  gMapHubMarkers.forEach(hm=>{
    if(showHubs){
      if(!gLeafletMap.hasLayer(hm))gLeafletMap.addLayer(hm);
    }else{
      if(gLeafletMap.hasLayer(hm))gLeafletMap.removeLayer(hm);
    }
  });

  (deliveries||[]).forEach(d=>{
    const st=truckState(d);
    if(gMapActiveFilter!=='all'&&gMapActiveFilter!=='hubs'&&gMapActiveFilter!==st)return;

    const geoPts=getGeoRoadPoints(d.origin,d.destination);
    if(geoPts.length<2)return;

    // Colores según tráfico y estado
    const stColor=st==='stopped'?'#f43f5e':st==='delayed'?'#f59e0b':d.status==='planned'?'#22d3ee':'#10b981';

    // Línea de carretera estilo Google Maps (casing blanco/oscuro + línea de tráfico)
    if(gMapTrafficOn){
      const casing=L.polyline(geoPts,{
        color:'#111827',
        weight:6.5,
        opacity:0.65,
        lineCap:'round',
        lineJoin:'round'
      }).addTo(gLeafletMap);

      const trafficLine=L.polyline(geoPts,{
        color:stColor,
        weight:4.2,
        opacity:0.95,
        dashArray:d.status==='in_transit'?'8, 6':null,
        lineCap:'round',
        lineJoin:'round'
      }).addTo(gLeafletMap);

      gMapRoutesMap[d.shipment_id]=[casing,trafficLine];
    }

    // Calcular posición actual del camión a lo largo de la ruta
    const pr=d.progress_pct||0;
    const currentCoord=interpolateGeoPoint(geoPts,pr);

    // Pin del camión
    const pinLabel='S-'+((d.shipment_id||'').replace(/\D/g,'').slice(-4)||'');
    const truckIcon=createGMapPinIcon(stColor,'truck',pinLabel,st);

    const marker=L.marker(currentCoord,{icon:truckIcon,zIndexOffset:st==='stopped'?1000:500}).addTo(gLeafletMap);
    marker.bindPopup(gmapInfoWindowHtml(d),{className:'gmap-popup'});
    if(openPopupShipId===d.shipment_id)marker.openPopup();
    gMapMarkersMap[d.shipment_id]=marker;
  });
}

function renderMapFallback(deliveries){
  // Fallback de alta fidelidad con la paleta de Google Maps
  const s={w:720,h:430,lngMin:-10.6,lngMax:12.5,latMin:33.6,latMax:52.5};
  const mapLL=(lat,lng)=>[(lng-s.lngMin)/(s.lngMax-s.lngMin)*s.w,(s.latMax-lat)/(s.latMax-s.latMin)*s.h];
  let out=`<rect width="${s.w}" height="${s.h}" fill="#111827"/>`;
  out+=`<text x="16" y="24" fill="#9ca3af" font-size="12">Modo Google Maps Vectorial (Offline)</text>`;
  return `<svg viewBox="0 0 ${s.w} ${s.h}" class="w-full h-auto rounded-xl">${out}</svg>`;
}

function renderDeliveriesTableRows(deliveries){

    const st=truckState(d);
    const chipColor=st==='stopped'?'red':st==='delayed'?'amber':d.status==='planned'?'cyan':'green';
    const stLabel=st==='stopped'?'detenido':st==='delayed'?'retrasado':d.status==='planned'?'programado':'todo bien';
    const inc=st!=='ok'&&st!=='planned'?(`<span class="chip ${st==='stopped'?'red':'amber'}">${d.delay_min>0?d.delay_min+' min · ':''}${d.telemetry_reason||(st==='delayed'?'retraso en ruta':'detenido')}</span>`):'<span class="muted">—</span>';
    return `<tr onclick="focusShipmentOnMap('${d.shipment_id}',true)" class="cursor-pointer transition-colors hover:bg-night-700/60" id="row-${d.shipment_id}">
    <td class="font-mono font-bold text-accent">${d.shipment_id}</td>

        <span class="text-[10px] muted">${Math.round(pc)}%</span>

    </td>
    <td class="muted">${d.speed_kmh||0} km/h</td>

    <td><span class="chip ${chipColor}">${stLabel}</span></td>

    <td><button onclick="event.stopPropagation();selectShipmentForDisruption('${d.shipment_id}')" class="btn text-[11px] py-0.5 px-2">Simular</button></td>
  </tr>`;
  }).join('');
}

function renderAgentLogsHtml(logs){

}

async function refreshLiveM2(){
  if(currentTab!=='m2')return;
  try{
    const [deliveries,logs]=await Promise.all([
      api('/api/routing/deliveries'),api('/api/routing/logs')
    ]);
    updateGMapDeliveries(deliveries);
    const tbody=$('#m2-deliveries-tbody');
    if(tbody)tbody.innerHTML=renderDeliveriesTableRows(deliveries);
    const logsEl=$('#m2-logs');
    if(logsEl)logsEl.innerHTML=renderAgentLogsHtml(logs);
    const logsCount=$('#m2-logs-count');
    if(logsCount)logsCount.textContent=`${logs.length} eventos`;

    const nOk=deliveries.filter(d=>truckState(d)==='ok').length;
    const nDelayed=deliveries.filter(d=>truckState(d)==='delayed').length;
    const nStopped=deliveries.filter(d=>truckState(d)==='stopped').length;
    if($('#gmap-chip-all'))$('#gmap-chip-all').textContent=`Todos (${deliveries.length})`;
    if($('#gmap-chip-ok'))$('#gmap-chip-ok').textContent=`🟢 En Ruta (${nOk})`;
    if($('#gmap-chip-delayed'))$('#gmap-chip-delayed').textContent=`🟡 Retrasados (${nDelayed})`;
    if($('#gmap-chip-stopped'))$('#gmap-chip-stopped').textContent=`🔴 Detenidos (${nStopped})`;
  }catch(e){
    console.warn('Error refrescando M2 en vivo:',e);
  }
}

async function simDisruption(){
  const payload={shipment_id:$('#m2-ship').value,delay_min:parseFloat($('#m2-delay').value||45),reason:$('#m2-reason').value,re_tender:true};
  const r=await api('/api/routing/simulate-disruption',{method:'POST',body:JSON.stringify(payload)});
  const statusTxt=r.requires_approval?'🔒 Requiere aprobación humana (Gobernanza)':'✅ Re-licitación autoejecutada';
  showToast(
    `Bucle Agéntico · ${payload.shipment_id}`,

}

function setStockMode(mode){
  stockCurrentMode=mode;
  $('#stock-mode-val').value=mode;
  ['add','sub','set'].forEach(m=>{
    const b=$('#stock-mode-'+m);
    if(b){
      b.classList.toggle('primary', (m==='add'&&mode==='add')||(m==='sub'&&mode==='subtract')||(m==='set'&&mode==='set'));
    }
  });
}

function previewStockSelection(){
  const skuSel=$('#stock-sku');
  const regSel=$('#stock-region');
  const prevDiv=$('#stock-current-preview');
  if(!skuSel||!regSel||!prevDiv)return;
  const sku=skuSel.value;
  const reg=regSel.value;
  const found=cachedStockRows.find(r=>r.sku===sku&&r.region_id===reg);
  if(found){
    const pct=Math.min(100,parseInt(found.fill_pct)||0);
    const color=pct<30?'text-crit':pct<60?'text-warn':'text-good';
    prevDiv.innerHTML=`
      <div class="flex items-center justify-between text-xs">
        <span>Stock actual en <b>${reg}</b>: <b class="${color} font-mono text-sm">${found.on_hand} unidades</b></span>
        <span class="muted">Zona: <b>${found.warehouse_zone||'Z-STO-A'}</b> · Reorden: <b>${found.reorder_point}u</b></span>
      </div>`;
    if($('#stock-reorder'))$('#stock-reorder').value=found.reorder_point||50;
    if($('#stock-zone'))$('#stock-zone').value=found.warehouse_zone||'Z-STO-A';
  }else{
    prevDiv.innerHTML=`<span class="muted text-xs">Sin existencias previas registradas para este producto en <b>${reg}</b>. Se creara nuevo registro.</span>`;
  }
}

async function submitStockManual(){
  const fb=$('#stock-manual-feedback');
  fb.innerHTML='<span class="text-accent">Guardando...</span>';
  try{
    const sku=$('#stock-sku').value;
    const region_id=$('#stock-region').value;
    const warehouse_zone=$('#stock-zone').value;
    const quantity=parseInt($('#stock-qty').value)||0;
    const mode=$('#stock-mode-val').value||'add';
    const reorder_point=parseInt($('#stock-reorder').value)||50;
    const notes=$('#stock-notes').value;

    const res=await api('/api/wms/stock/update',{
      method:'POST',
      body:JSON.stringify({sku,region_id,warehouse_zone,quantity,mode,reorder_point,notes})
    });

    fb.innerHTML=`<span class="text-good font-semibold">✅ Stock actualizado: ${res.sku} en ${res.region_id} ahora tiene ${res.on_hand} unidades (${res.mode==='add'?'+':res.mode==='subtract'?'-':'='}${res.quantity_delta})</span>`;
    loadKPIs();
    // Actualizar tabla localmente
    const stock=await api('/api/demand/stock');
    cachedStockRows=stock||[];
    filterStockTable();
    previewStockSelection();
  }catch(e){
    fb.innerHTML=`<span class="text-crit">❌ Error: ${e.message}</span>`;
  }
}

async function quickAdjustStock(sku,region_id,delta){
  try{
    const mode=delta>0?'add':'subtract';
    const qty=Math.abs(delta);
    await api('/api/wms/stock/update',{
      method:'POST',
      body:JSON.stringify({sku,region_id,quantity:qty,mode})
    });
    const stock=await api('/api/demand/stock');
    cachedStockRows=stock||[];
    filterStockTable();
    previewStockSelection();
    loadKPIs();
  }catch(e){
    alert('Error al ajustar stock: '+e.message);
  }
}

function renderStockTableRows(rows){
  if(!rows||rows.length===0){
    return '<tr><td colspan="9" class="text-center py-4 muted">No hay registros de inventario con los filtros actuales.</td></tr>';
  }
  return rows.map(r=>{
    const pct=Math.min(100,Math.max(0,parseInt(r.fill_pct)||0));
    const isCrit=pct<30;
    const isLow=pct>=30&&pct<60;
    const barBg=isCrit?'bg-red-500':isLow?'bg-amber-500':'bg-emerald-500';
    const chipClass=isCrit?'red':isLow?'amber':'green';
    const chipText=isCrit?'⚠ Critico':isLow?'Bajo':'Optimo';

    return `<tr>
      <td class="font-mono text-accent font-bold">${r.sku}</td>
      <td>
        <div class="text-white font-medium truncate max-w-[180px]">${r.name}</div>
        <div class="text-[10px] muted capitalize">${r.category||'general'}</div>
      </td>
      <td><span class="font-semibold text-gray-200">${r.region_id}</span></td>
      <td><span class="chip cyan text-[10px]">${r.warehouse_zone||'Z-STO-A'}</span></td>
      <td class="text-right font-mono font-bold text-base text-white">${r.on_hand}</td>
      <td>
        <div class="flex items-center gap-1.5">
          <div class="flex-1 bg-night-700 rounded-full h-2 overflow-hidden">
            <div class="${barBg} h-full rounded-full transition-all" style="width:${pct}%"></div>
          </div>
          <span class="text-[10px] muted font-mono w-7 text-right">${pct}%</span>
        </div>
      </td>
      <td class="font-mono text-gray-400">${r.reorder_point||0}</td>
      <td><span class="chip ${chipClass}">${chipText}</span></td>
      <td>
        <div class="flex items-center gap-1">
          <button onclick="quickAdjustStock('${r.sku}','${r.region_id}',10)" class="btn text-[10px] py-0.5 px-1.5" title="Sumar 10">+10</button>
          <button onclick="quickAdjustStock('${r.sku}','${r.region_id}',50)" class="btn text-[10px] py-0.5 px-1.5" title="Sumar 50">+50</button>
          <button onclick="quickAdjustStock('${r.sku}','${r.region_id}',-10)" class="btn text-[10px] py-0.5 px-1.5" title="Restar 10">-10</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function filterStockTable(){
  const q=($('#stock-search')?$('#stock-search').value:'').trim().toLowerCase();
  const reg=$('#stock-filter-reg')?$('#stock-filter-reg').value:'';
  const stat=$('#stock-filter-stat')?$('#stock-filter-stat').value:'';

  let filtered=cachedStockRows.filter(r=>{
    if(q){
      const matchSku=(r.sku||'').toLowerCase().includes(q);
      const matchName=(r.name||'').toLowerCase().includes(q);
      if(!matchSku&&!matchName)return false;
    }
    if(reg&&r.region_id!==reg)return false;
    if(stat){
      const pct=Math.min(100,parseInt(r.fill_pct)||0);
      if(stat==='crit'&&pct>=30)return false;
      if(stat==='low'&&(pct<30||pct>=60))return false;
      if(stat==='ok'&&pct<60)return false;
    }
    return true;
  });

  const tbody=$('#stock-table-tbody');
  if(tbody)tbody.innerHTML=renderStockTableRows(filtered);
  const countEl=$('#stock-items-count');
  if(countEl)countEl.innerText=`${filtered.length} de ${cachedStockRows.length} registros`;
}

async function refreshLiveStock(notify=false){
  try{
    const [stock,summary]=await Promise.all([
      api('/api/demand/stock'),
      api('/api/wms/stock/summary')
    ]);
    if(stock && Array.isArray(stock)){
      cachedStockRows=stock;
      filterStockTable();
      previewStockSelection();
    }
    if(summary){
      // Actualizar KPIs de stock en vivo
      const unitsEl = $('#kpi-stock-units');
      if(unitsEl && summary.total_units !== undefined){
        unitsEl.innerText = Number(summary.total_units).toLocaleString();
      }
      const skusEl = $('#kpi-stock-skus');
      if(skusEl && summary.total_skus !== undefined){
        skusEl.innerText = summary.total_skus;
      }
      const regsEl = $('#kpi-stock-regions');
      if(regsEl && summary.regions){
        regsEl.innerText = summary.regions.length;
      }
      const critEl = $('#kpi-stock-crit');
      const critSub = $('#kpi-stock-crit-sub');
      const critCard = $('#kpi-stock-crit-card');
      const critIcon = $('#kpi-stock-crit-icon');
      const critLabel = $('#kpi-stock-crit-label');
      if(critEl && summary.critical_count !== undefined){
        const count = summary.critical_count;
        critEl.innerText = count;
        critEl.className = `text-2xl font-bold ${count > 0 ? 'text-crit' : 'text-emerald-400'} my-1 font-mono`;
        if(critSub) critSub.innerText = count > 0 ? 'Artículos bajo punto crítico' : 'Todos en nivel óptimo';
        if(critSub) critSub.className = `text-[11px] ${count > 0 ? 'text-rose-400 font-semibold' : 'text-emerald-400'}`;
        if(critCard) {
          critCard.classList.toggle('border-crit/50', count > 0);
          critCard.classList.toggle('bg-crit/5', count > 0);
        }
        if(critIcon) critIcon.innerText = count > 0 ? '⚠️' : '✅';
        if(critLabel) critLabel.className = `text-xs font-medium ${count > 0 ? 'text-rose-300' : 'text-gray-400'}`;
      }
    }
  }catch(e){
    console.warn('Error en auto-sincronización de stock:', e);
    if(notify) alert('Error al refrescar stock: ' + e.message);
  }
}

function handleStockDrop(e){

  if(zone) zone.classList.remove('dragover');
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0){

function handleStockFileSelected(e){
  const file = e.target.files && e.target.files[0];

function setStockSelectedFile(file){
  selectedStockFile = file;
  const info = $('#stock-selected-file-info');
  const nameEl = $('#stock-file-name');
  const sizeEl = $('#stock-file-size');
  const iconEl = $('#stock-file-icon');
  
  if(!info) return;

  const isExcel = file.name.endsWith('.xlsx') || file.name.endsWith('.xls');
  iconEl.innerText = isExcel ? '📗' : '📄';
  nameEl.innerText = file.name;
  sizeEl.innerText = `${(file.size / 1024).toFixed(1)} KB · ${isExcel ? 'Libro de Excel' : 'Archivo CSV / Texto'}`;
  info.classList.remove('hidden');

  // Si es CSV o TXT, cargar texto en el textarea de respaldo por si el usuario quiere inspeccionarlo
  if(!isExcel){
    const reader = new FileReader();
    reader.onload = evt => {
      const ta = $('#stock-csv-textarea');
      if(ta) ta.value = evt.target.result;
    };
    reader.readAsText(file);
  }
}

async function processSelectedStockFile(){
  const fb = $('#stock-csv-feedback');
  fb.innerHTML = '<div class="p-3 bg-night-900 rounded border border-night-700 text-accent flex items-center gap-2"><span class="animate-spin">⏳</span> Procesando archivo de inventario...</div>';

  const modeRadio = document.querySelector('input[name="csv-mode"]:checked');
  const mode = modeRadio ? modeRadio.value : 'add';

  // Si hay un archivo seleccionado directamente (drag & drop o selector)
  if(selectedStockFile){
    const isExcel = selectedStockFile.name.endsWith('.xlsx') || selectedStockFile.name.endsWith('.xls');
    const formData = new FormData();
    formData.append('file', selectedStockFile);

    try {
      const url = isExcel ? `/api/wms/stock/import-excel?mode=${mode}` : `/api/wms/stock/import-csv?mode=${mode}`;
      const res = await fetch(API + url, {
        method: 'POST',
        body: formData
      });

      if(!res.ok){
        const errText = await res.text();
        throw new Error(errText);
      }
      const data = await res.json();
      displayImportResult(data, isExcel ? 'Excel' : 'CSV');
    } catch(err){
      fb.innerHTML = `<div class="p-3 bg-red-950/40 rounded border border-crit/40 text-rose-300">❌ Error al procesar archivo: ${err.message}</div>`;
    }
    return;
  }

  // De lo contrario, comprobar si hay texto pegado en el textarea
  const text = $('#stock-csv-textarea') ? $('#stock-csv-textarea').value.trim() : '';
  if(!text){
    fb.innerHTML = '<div class="p-3 bg-amber-950/40 rounded border border-warn/40 text-amber-300">⚠️ Por favor selecciona o arrastra un archivo Excel / CSV, o pega texto en el área correspondiente.</div>';
    return;
  }

  try {
    const res = await api('/api/wms/stock/import-csv', {
      method: 'POST',
      body: JSON.stringify({ csv_text: text, mode })
    });
    displayImportResult(res, 'Texto CSV');
  } catch(err){
    fb.innerHTML = `<div class="p-3 bg-red-950/40 rounded border border-crit/40 text-rose-300">❌ Error al procesar datos: ${err.message}</div>`;
  }
}

function displayImportResult(res, fileType){
  const fb = $('#stock-csv-feedback');
  let errHtml = '';
  if(res.errors && res.errors.length){
    errHtml = `
      <div class="mt-2 p-2 bg-red-950/30 rounded border border-crit/30 text-rose-300 text-[11px] max-h-32 overflow-y-auto">
        <b>Advertencias / Errores:</b><br>${res.errors.join('<br>')}
      </div>`;
  }

  fb.innerHTML = `
    <div class="p-3.5 bg-emerald-950/30 rounded-lg border border-emerald-500/40 shadow-sm animate-fade-in">
      <div class="flex items-center gap-2 text-emerald-400 font-bold text-sm">
        <span>✅</span> ¡Carga de ${fileType} procesada con éxito!
      </div>
      <div class="text-xs text-gray-200 mt-1">
        Se actualizaron correctamente <b class="text-white font-mono">${res.rows_updated}</b> registros de un total de <b class="text-white font-mono">${res.rows_processed}</b> filas analizadas.
      </div>
      ${errHtml}
    </div>`;

  clearStockSelectedFile();
  // Recargar datos y refrescar vista
  loadStockTab();
  loadKPIs();
}

function updateSaleProductPrice(){
  const skuSel=$('#sale-sku');
  const chSel=$('#sale-channel');
  if(!skuSel)return;
  const sku=skuSel.value;
  const ch=chSel?chSel.value:'retail';
  const base=BASE_PRICES[sku]||50;
  const mult=ch==='retail'?1.15:ch==='ecommerce'?1.05:0.85;
  const priceInput=$('#sale-price');
  if(priceInput)priceInput.value=(base*mult).toFixed(2);
  calcSaleTotal();
}

function calcSaleTotal(){
  const units=parseInt($('#sale-units')?.value)||0;
  const p=parseFloat($('#sale-price')?.value)||0;
  const prev=$('#sale-total-preview');
  if(prev)prev.textContent=(units*p).toFixed(2)+' €';
}

async function submitManualSale(){
  const fb=$('#sale-manual-feedback');
  fb.innerHTML='<span class="text-accent">Registrando venta...</span>';
  try{
    const sku=$('#sale-sku').value;
    const region_id=$('#sale-region').value;
    const units=parseInt($('#sale-units').value)||1;
    const price_eur=parseFloat($('#sale-price').value)||null;
    const channel=$('#sale-channel').value||'retail';

    const res=await api('/api/demand/sales/record',{
      method:'POST',
      body:JSON.stringify({sku,region_id,units,price_eur,channel})
    });

    fb.innerHTML=`<span class="text-good font-semibold">✅ Venta registrada: ${res.units}u de ${res.sku} (${res.total_eur}€). Stock remanente: ${res.current_stock}u</span>`;
    loadKPIs();
    refreshSalesFeed();
  }catch(e){
    fb.innerHTML=`<span class="text-crit">❌ Error: ${e.message}</span>`;
  }
}

function renderSalesFeedRows(rows){
  if(!rows||rows.length===0){
    return '<tr><td colspan="9" class="text-center py-4 muted">Esperando transmision de transacciones...</td></tr>';
  }
  return rows.map(r=>{
    const chClass=r.channel==='retail'?'green':r.channel==='ecommerce'?'cyan':'amber';
    const isCrit=(r.current_stock!==null&&r.reorder_point!==null&&r.current_stock<=r.reorder_point);
    const alertChip=isCrit
      ? `<span class="chip red text-[10px] animate-pulse">⚠ Bajo Minimo (${r.current_stock}u)</span>`
      : '<span class="chip green text-[10px]">Ok</span>';

    return `<tr class="transition-colors hover:bg-night-700/60">
      <td class="font-mono text-gray-300 text-xs">${r.time||(r.timestamp||'').slice(11,19)||'Reciente'}</td>
      <td class="font-mono text-gray-400 text-xs">#TX-${r.id||(r.sku?r.sku.replace(/\D/g,''):'00')}</td>
      <td>
        <div class="text-white font-medium text-xs">${r.product_name||r.sku}</div>
        <div class="text-[10px] font-mono muted">${r.sku}</div>
      </td>
      <td><span class="font-semibold text-gray-300">${r.region_name||r.region_id}</span></td>
      <td><span class="chip ${chClass} capitalize text-[10px]">${r.channel}</span></td>
      <td class="text-right font-mono font-bold text-white text-xs">${r.units}</td>
      <td class="text-right font-mono text-accent font-bold text-xs">${parseFloat(r.total_eur||0).toFixed(2)} €</td>
      <td class="text-right font-mono ${isCrit?'text-crit font-bold':'text-gray-300'} text-xs">${r.current_stock!==null?r.current_stock+' u':'—'}</td>
      <td>${alertChip}</td>
    </tr>`;
  }).join('');
}

function renderSalesCharts(kpis){
  if(salesChannelChart){salesChannelChart.destroy();salesChannelChart=null;}
  const ctx=$('#salesChannelChart');
  if(!ctx)return;
  const labels=(kpis.by_channel||[]).map(c=>c.channel.toUpperCase());
  const data=(kpis.by_channel||[]).map(c=>c.revenue);

  salesChannelChart=new Chart(ctx,{
    type:'bar',
    data:{
      labels:labels.length?labels:['RETAIL','ECOMMERCE','DISTRIBUIDOR'],
      datasets:[{
        label:'Facturacion (€)',

}

function downloadSalesHistoryCsv(){
  let csv="id,timestamp,sku,region,channel,units,total_eur\n";
  cachedSalesFeed.forEach(r=>{
    csv+=`${r.id||''},"${r.timestamp||r.time||''}","${r.sku}","${r.region_id}","${r.channel}",${r.units},${r.total_eur}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='ventas_historial.csv';
  a.click();
}

let realOrdersOffset = 0;
const REAL_ORDERS_LIMIT = 40;

function changeRealOrdersPage(delta){
  const nextOffset = Math.max(0, realOrdersOffset + delta * REAL_ORDERS_LIMIT);
  filterRealOrders(nextOffset);
}

function renderRealOrderRows(rows){
  if(!rows || rows.length === 0){
    return '<tr><td colspan="10" class="text-center py-4 text-gray-400">No se encontraron pedidos con esos filtros.</td></tr>';
  }
  return rows.map(r=>{
    const isLate = r.delay_status === 'Atrasado';
    const hasRet = r.return_reason && r.return_reason !== 'S/ Devolu.';
    return `
      <tr class="hover:bg-night-800/60 transition-colors">
        <td class="p-2 font-mono font-bold text-accent">${r.order_id}</td>
        <td class="p-2 text-white font-medium truncate max-w-[120px]">${r.client}</td>
        <td class="p-2 text-gray-300 truncate max-w-[120px]">${r.driver}</td>
        <td class="p-2"><span class="chip cyan text-[10px] font-mono">${r.destination}</span></td>
        <td class="p-2 text-right font-mono font-bold text-white">${r.items_count}</td>
        <td class="p-2 text-right font-mono text-emerald-400 font-semibold">R$ ${parseFloat(r.billed_brl||0).toFixed(2)}</td>
        <td class="p-2 text-center font-mono text-[11px] text-gray-400">${r.planned_delivery_date||'—'}</td>
        <td class="p-2 text-center font-mono text-[11px] ${isLate?'text-rose-400 font-bold':'text-emerald-400'}">${r.actual_delivery_date||'—'}</td>
        <td class="p-2 text-center">
          <span class="chip ${hasRet?'amber':'gray'} text-[10px]">${r.return_reason||'S/ Devolu.'}</span>
        </td>
        <td class="p-2 text-center">
          <span class="chip ${isLate?'red':'green'} text-[10px] font-semibold">${r.delay_status}</span>
        </td>
      </tr>
    `;
  }).join('');
}

async function filterRealOrders(offset=0){
  realOrdersOffset = offset;
  const q = ($('#real-filter-q')?.value || '').trim();
  const dest = $('#real-filter-dest')?.value || '';
  const status = $('#real-filter-status')?.value || '';
  const retReason = $('#real-filter-return')?.value || '';
  let url = `/api/logistics/orders?limit=${REAL_ORDERS_LIMIT}&offset=${realOrdersOffset}`;
  if(dest) url += `&region=${encodeURIComponent(dest)}`;
  if(status) url += `&status=${encodeURIComponent(status)}`;
  if(retReason) url += `&return_reason=${encodeURIComponent(retReason)}`;
  if(q) url += `&q=${encodeURIComponent(q)}`;

  try{
    const res = await api(url);
    const orders = res.orders || [];
    const total = res.total || 0;
    const tbody = $('#real-orders-tbody');
    if(tbody) tbody.innerHTML = renderRealOrderRows(orders);
    const info = $('#real-orders-page-info');
    if(info){
      const start = total === 0 ? 0 : realOrdersOffset + 1;
      const end = Math.min(total, realOrdersOffset + orders.length);
      info.textContent = `Mostrando ${start}–${end} de ${total.toLocaleString()} pedidos`;
    }
    const prevBtn = $('#real-btn-prev');
    const nextBtn = $('#real-btn-next');
    if(prevBtn) prevBtn.disabled = realOrdersOffset <= 0;
    if(nextBtn) nextBtn.disabled = (realOrdersOffset + REAL_ORDERS_LIMIT) >= total;
  }catch(e){

}

/* ---- master ---- */
async function loadTab(){
  loadKPIs();
  try{
    if(currentTab==='m1')await loadM1();
    else if(currentTab==='m2')await loadM2();
    else if(currentTab==='m3')await loadM3();
    else if(currentTab==='m4')await loadM4();
    else if(currentTab==='m5')await loadM5();
    else if(currentTab==='stock')await loadStockTab();
    else if(currentTab==='sales')await loadSalesTab();
    else if(currentTab==='logistics')await loadLogisticsTab();
    else if(currentTab==='findings')loadFindingsTab();
    else if(currentTab==='testing')loadTestingTab();
  }catch(e){ render(`<div class="card p-8 text-center text-crit">Error: ${e.message}</div>`); }
}

async function runAllDemos(){
  const btn=$('button[onclick="runAllDemos()"]');
  if(!btn)return;
  btn.textContent='Ejecutando…';btn.disabled=true;
  try{
    await api('/api/wms/telemetry/simulate',{method:'POST'});
    await new Promise(r=>setTimeout(r,300));
    const deliveries=await api('/api/routing/deliveries');
    const live=deliveries.find(d=>d.status==='in_transit');
    if(live)await api('/api/routing/simulate-disruption',{method:'POST',body:JSON.stringify({shipment_id:live.shipment_id,delay_min:40,reason:'retención aduanera',re_tender:true})});
    await loadTab();await loadKPIs();
    setTimeout(()=>switchTab('m5'),400);
  }catch(e){alert('Demo: '+e.message);}
  btn.textContent='▶ Demo autónoma';btn.disabled=false;
}

/* ---- Boot: esperar a que la base de datos esté lista ---- */
async function boot(){
  $('#content').innerHTML=`
    <div class="flex flex-col items-center justify-center py-24 gap-4">
      <div class="w-12 h-12 border-4 border-accent/30 border-t-accent rounded-full animate-spin"></div>
      <div class="text-sm muted">Inicializando motor de previsión, WMS y agentes…</div>
      <div class="text-[11px] muted">Primera carga: preparando datos semilla</div>
    </div>`;
  for(let i=0;i<60;i++){
    try{
      const h=await api('/api/health');
      if(h.db_ready){
        const target=location.hash.replace('#','');
        if(['m1','m2','m3','m4','m5','stock','sales','logistics','findings','testing'].includes(target))switchTab(target);
        else loadTab();
        setInterval(loadKPIs,20000);
        setInterval(()=>{ if(currentTab==='m2')refreshLiveM2(); },8000);
        setInterval(()=>{ if(currentTab==='m3')loadM3(); },15000);
        setInterval(()=>{ if(currentTab==='sales')refreshSalesFeed(); },3500);
        setInterval(()=>{ if(currentTab==='stock')refreshLiveStock(); },4000);
        return;
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,500));
  }
  $('#content').innerHTML=`<div class="card p-8 text-center text-crit">El servidor tarda demasiado. ¿Está corriendo?</div>`;
}
boot();
</script>
